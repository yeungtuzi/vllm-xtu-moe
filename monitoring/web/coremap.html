<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<title>CPU 核心地图</title>
<style>
  :root { --gap:3px; }
  * { box-sizing: border-box; }
  body { margin:0; background:#0e1116; color:#c9d1d9; font:11px/1.2 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif; }
  /* 大方块:约占屏幕 1/4 */
  #big { margin:6px; padding:6px; border:2px solid #3b4252; border-radius:6px; background:#161b22;
         width:calc(100% - 12px); }
  /* 8 个 NUMA node 区:粗框 + 各组不同浅底色 */
  #nodes { display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(2,1fr); gap:var(--gap); }
  .node { border:2px solid rgba(0,0,0,.45); border-radius:5px; padding:3px; display:flex; flex-direction:column; gap:2px; }
  .nodehead { display:flex; justify-content:space-between; align-items:baseline; font-weight:600; font-size:10px; color:#1f2328; }
  .nodehead .pct { font-weight:700; }
  /* CCD 分组:细框 + 比 node 稍深的底色 */
  .ccds { display:flex; flex-direction:column; gap:2px; flex:1; }
  .ccd { border:1px dashed rgba(0,0,0,.5); border-radius:3px; padding:1px 2px 2px; flex:1; display:flex; flex-direction:column; }
  .ccdhead { font-size:8px; color:rgba(0,0,0,.55); letter-spacing:.2px; margin-bottom:1px; }
  /* 每个物理核:极小的方块,只放颜色 + 数字 */
  .cores { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; flex:1; }
  .core { display:flex; align-items:center; justify-content:center; border-radius:2px;
          font-size:9px; font-weight:700; line-height:1; min-height:13px; color:#10131a; }
  #meta { display:flex; gap:14px; align-items:center; margin:4px 8px 8px; font-size:11px; color:#8b949e; }
  #meta b { color:#c9d1d9; }
  .bad { color:#f85149; }
</style></head>
<body>
<div id="big"><div id="nodes"></div></div>
<div id="meta">刷新 <b id="ts">—</b> · 主机 load1 <b id="l1">—</b> · load1/192核 <b id="lpc">—</b> · 繁忙核(&gt;50%) <b id="busy">—</b> · 平均 <b id="avg">—</b></div>
<script>
const API = "http://127.0.0.1:9090/api/v1/query";
const hue = n => (n * 47) % 360;                      // 每个 node 一个色相
const nodeBg = n => `hsl(${hue(n)},55%,95%)`;         // node 浅底色
const ccdBg  = (n,c) => `hsl(${hue(n)+((c%3)*12-12)},50%,${90 - (c%2)*3}%)`; // CCD 稍深的浅色
const color = v => v < 50 ? `hsl(${120 - v*1.6},70%,${72 - v*0.18}%)`
                : v < 80 ? `hsl(${60 - (v-50)*1.8},85%,60%)`
                : `hsl(${Math.max(0,30-(v-80)*1.5)},80%,${55-(v-80)*0.15}%)`;

async function jq(expr) {
  const r = await fetch(`${API}?query=${encodeURIComponent(expr)}`);
  const j = await r.json();
  return (j.data && j.data.result) || [];
}
let built = false, tiles = {};
function build(rows) {
  // rows: [{core,node,ccd}]
  const byNode = {};
  for (const m of rows) {
    const n = m.node ?? "?", c = m.ccd ?? "?";
    (byNode[n] ||= {})[c] ||= [];
    byNode[n][c].push(m.core);
  }
  const host = document.getElementById("nodes"); host.innerHTML = "";
  for (const n of Object.keys(byNode).sort((a,b)=>a-b)) {
    const nd = document.createElement("div");
    nd.className = "node"; nd.style.background = nodeBg(+n);
    nd.innerHTML = `<div class="nodehead"><span>NUMA ${n}</span><span class="pct" id="np-${n}">–</span></div>`;
    const cds = document.createElement("div"); cds.className = "ccds";
    for (const c of Object.keys(byNode[n]).sort((a,b)=>a-b)) {
      const cd = document.createElement("div");
      cd.className = "ccd"; cd.style.background = ccdBg(+n, +c);
      cd.innerHTML = `<div class="ccdhead">CCD ${c}</div>`;
      const cs = document.createElement("div"); cs.className = "cores";
      for (const core of byNode[n][c].sort((a,b)=>a-b)) {
        const t = document.createElement("div");
        t.className = "core"; t.id = `c-${core}`; t.textContent = "–";
        cs.appendChild(t); tiles[core] = t;
      }
      cd.appendChild(cs); cds.appendChild(cd);
    }
    nd.appendChild(cds); host.appendChild(nd);
  }
  built = true;
}
async function tick() {
  const rows = await jq('xtu_core_utilization_percent');
  if (!rows.length) return;
  if (!built) build(rows.map(r => r.metric));
  let sum = 0, busy = 0;
  for (const r of rows) {
    const v = Math.round(parseFloat(r.value[1]));
    const t = tiles[r.metric.core];
    if (t) { t.textContent = v; t.style.background = color(v); }
    sum += v; if (v > 50) busy++;
  }
  const n = rows.length;
  const perNode = {};
  for (const r of rows) { const v = +r.value[1]; (perNode[r.metric.node] ||= []).push(v); }
  for (const k in perNode) {
    const el = document.getElementById(`np-${k}`);
    if (el) el.textContent = (perNode[k].reduce((a,b)=>a+b,0)/perNode[k].length).toFixed(0) + "%";
  }
  document.getElementById("busy").textContent = busy + " / " + n;
  document.getElementById("avg").textContent = (sum/n).toFixed(1) + "%";
  const l = await jq('node_load1');
  if (l.length) {
    const v = parseFloat(l[0].value[1]);
    document.getElementById("l1").textContent = v.toFixed(2);
    document.getElementById("lpc").textContent = (v/n).toFixed(3);
  }
  document.getElementById("ts").textContent = new Date().toLocaleTimeString();
}
tick(); setInterval(tick, 5000);
</script></body></html>
