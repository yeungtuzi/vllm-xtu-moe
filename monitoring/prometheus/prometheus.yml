global:
  scrape_interval: 5s
  evaluation_interval: 15s
scrape_configs:
  - job_name: vllm
    static_configs:
      - targets: ['127.0.0.1:8070']
        labels: {service: vllm, model: DeepSeek-V4.1-Flash}
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels: {service: host}
  - job_name: lmcache
    static_configs:
      - targets: ['127.0.0.1:8080']
        labels: {service: lmcache}
