[paths]
provisioning = /home/user/lvllm/monitoring/grafana/provisioning
data = /home/user/lvllm/monitoring/grafana/data
logs = /home/user/lvllm/monitoring/grafana/logs
plugins = /home/user/lvllm/monitoring/grafana/plugins

[server]
http_addr = 127.0.0.1
http_port = 3000

[auth.anonymous]
enabled = true
org_role = Admin

[analytics]
reporting_enabled = false
check_for_updates = false

[panels]
disable_sanitize_html = true

[security]
allow_embedding = true
